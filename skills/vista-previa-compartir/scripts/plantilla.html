<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Lámina de 1200×630 para og:image. generar.py reemplaza __DATOS__ y __LOGO__ y la fotografía con Chrome headless. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root{--ink:#171726;--paper:#F4F5F5;--mist:#ADB3B5;--accent:#9AA6FF}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--ink)}
body{font-family:Geist,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased;position:relative}
.foto{position:absolute;inset:0;background-size:cover;background-position:center}
.velo{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(23,23,38,.94) 0%,rgba(23,23,38,.82) 34%,rgba(23,23,38,.35) 66%,rgba(23,23,38,.1) 100%),
  linear-gradient(0deg,rgba(23,23,38,.7) 0%,rgba(23,23,38,0) 45%),
  linear-gradient(180deg,rgba(23,23,38,.6) 0%,rgba(23,23,38,0) 28%)}
.logo{position:absolute;left:64px;top:56px;width:156px;color:var(--paper)}
.logo svg{display:block;width:100%;height:auto}
.marca{position:absolute;right:64px;top:62px;font:500 13px/1 'Geist Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--paper);text-shadow:0 1px 8px rgba(23,23,38,.6)}
.bloque{position:absolute;left:64px;bottom:64px;width:700px}
.etiqueta{display:flex;align-items:center;gap:12px;font:500 15px/1 'Geist Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
.etiqueta i{width:8px;height:8px;background:var(--accent);display:block}
h1{font-weight:300;font-size:68px;line-height:1.02;letter-spacing:-.025em}
h1 em{font-style:normal;color:var(--accent)}
.pie{margin-top:30px;padding-top:22px;border-top:1px solid rgba(244,245,245,.28);font:400 15px/1 'Geist Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--mist);width:520px}
/* Plataformas: indicador 01–04 del ecosistema, como el slider de la Home */
.indice{position:absolute;right:64px;bottom:64px;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.indice b{font:500 15px/1 'Geist Mono',monospace;letter-spacing:.18em;color:var(--paper)}
.indice b span{color:var(--mist)}
.barras{display:flex;gap:6px}
.barras i{width:44px;height:3px;background:rgba(244,245,245,.3);display:block}
.barras i.on{background:var(--paper)}
/* Mosaico (Ecosistema): cuatro columnas, una por plataforma */
.mosaico{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--ink)}
.mosaico div{position:relative;background-size:cover;background-position:center}
.mosaico div:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(23,23,38,.92) 0%,rgba(23,23,38,.25) 55%,rgba(23,23,38,.55) 100%)}
.mosaico span{position:absolute;z-index:1;left:22px;right:18px;bottom:30px;font:400 22px/1.15 Geist,sans-serif;letter-spacing:-.01em}
.mosaico span small{display:block;font:500 12px/1 'Geist Mono',monospace;letter-spacing:.2em;color:var(--accent);margin-bottom:12px}
.tipo-mosaico .bloque{top:132px;bottom:auto}
/* Plano → obra (Activos): mitad plano, mitad obra, con la costura vertical */
.split{position:absolute;inset:0}
.split div{position:absolute;inset:0;background-size:cover;background-position:center}
.split .obra{clip-path:inset(0 0 0 52%)}
.split:after{content:'';position:absolute;top:0;bottom:0;left:52%;width:2px;background:var(--paper)}
.tipo-plano-obra .velo{background:linear-gradient(90deg,rgba(23,23,38,.9) 0%,rgba(23,23,38,.6) 40%,rgba(23,23,38,0) 60%)}
.rotulo{position:absolute;top:60px;font:500 13px/1 'Geist Mono',monospace;letter-spacing:.22em;color:var(--paper);background:rgba(23,23,38,.7);padding:8px 10px}
</style>
</head>
<body>
<div id="raiz"></div>
<script>
const D = __DATOS__;
const LOGO = `__LOGO__`;
const og = D.og, url = p => `url('${D.raiz}/${p}')`;  // comillas simples: va dentro de style="…"
document.body.className = 'tipo-' + og.tipo;
let h = '';
if (og.tipo === 'mosaico') {
  h += '<div class="mosaico">' + D.plataformas.map((p, i) =>
    `<div style="background-image:${url(p.foto)};background-position:${p.posicion || 'center'}"><span><small>0${i + 1}</small>${p.nombre}</span></div>`).join('') + '</div>';
  h += '<div class="velo" style="background:linear-gradient(180deg,rgba(23,23,38,.85) 0%,rgba(23,23,38,.35) 45%,rgba(23,23,38,0) 70%)"></div>';
} else if (og.tipo === 'plano-obra') {
  h += `<div class="split"><div style="background-image:${url(og.plano)}"></div><div class="obra" style="background-image:${url(og.obra)}"></div></div><div class="velo"></div>`;
  h += '<div class="rotulo" style="left:calc(52% - 84px)">PLANO</div><div class="rotulo" style="left:calc(52% + 18px)">OBRA</div>';
} else {
  h += `<div class="foto" style="background-image:${url(og.foto)};background-position:${og.posicion || 'center'}"></div><div class="velo"></div>`;
}
h += `<div class="logo">${LOGO}</div>`;
if (og.tipo === 'plataforma') h += '<div class="marca">Ecosistema PRODI</div>';
h += `<div class="bloque"><div class="etiqueta"><i></i>${og.etiqueta}</div><h1>${og.titular}</h1>${og.pie ? `<div class="pie">${og.pie}</div>` : ''}</div>`;
if (og.tipo === 'plataforma') h += `<div class="indice"><b>0${og.indice} <span>/ 04</span></b><div class="barras">${[1, 2, 3, 4].map(n => `<i class="${n === og.indice ? 'on' : ''}"></i>`).join('')}</div></div>`;
document.getElementById('raiz').innerHTML = h;
</script>
</body>
</html>
