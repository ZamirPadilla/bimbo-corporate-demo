<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
@media (max-width: 900px){ [data-ft-grid]{grid-template-columns:1fr 1fr !important} [data-ft-brand]{grid-column:1 / -1 !important} [data-ft-big]{font-size:22vw !important} }
</style>
</helmet>
<footer style="font-family:Outfit, system-ui, sans-serif;background:#0F2F51;color:#FAE5C5;overflow:hidden">
  
  <div style="max-width:1440px;margin:0 auto;padding:80px 32px 40px">
    <div data-ft-grid="" style="display:grid;grid-template-columns:1.4fr repeat(4, minmax(0,1fr));gap:40px">
      <div data-ft-brand="" style="display:flex;flex-direction:column;gap:20px;max-width:340px">
        <div style="display:flex;align-items:center;gap:16px"><img src="https://www.grupobimbo.com/themes/custom/bimbo/logo.svg" alt="Grupo Bimbo" style="height:56px;width:auto;display:block"><div style="display:flex;align-items:center;gap:10px;border-left:1px solid rgba(250,229,197,.3);padding-left:16px"><span style="font-family:poleno, Lilita One, Outfit, sans-serif;font-weight:900;font-size:52px;line-height:.8;color:#FAE5C5">80</span><span style="font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;line-height:1.3;color:#FAE5C5">años<br>1945–2025</span></div></div><div style="font-size:28px;font-weight:300;line-height:1.15;color:#fff;text-wrap:pretty">Alimentamos un mundo mejor desde 1945.</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <sc-for list="{{ redes }}" as="r" hint-placeholder-count="5">
            <a href="#" style="color:#FAE5C5;text-decoration:none;font-size:13px;border:1px solid rgba(250,229,197,.3);border-radius:999px;padding:6px 14px" style-hover="background:#FAE5C5;color:#0F2F51">{{ r }}</a>
          </sc-for>
        </div>
      </div>
      <sc-for list="{{ cols }}" as="c" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:#8FC9E6;font-weight:600;margin-bottom:6px">{{ c.t }}</div>
          <sc-for list="{{ c.items }}" as="i" hint-placeholder-count="5">
            <a href="{{ i.href }}" style="color:#FAE5C5;text-decoration:none;font-size:15.5px;opacity:.9" style-hover="color:#fff;opacity:1">{{ i.t }}</a>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="max-width:1440px;margin:0 auto;padding:0 32px 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap">
    <div style="font-family:Lilita One, Outfit, sans-serif;font-weight:400;font-size:clamp(40px, 5vw, 80px);text-transform:uppercase;letter-spacing:0;line-height:.85;color:#FAE5C5">¡Buen provecho!</div>
    <img src="https://d2rwhogv2mrkk6.cloudfront.net/s3fs-public/nosotros/ReconocimientosOso%402x.png?VersionId=R8UMvfLKQl.hrjIRUZf6dh4V67H6gPVd" alt="El Osito Bimbo" style="height:150px;width:auto;display:block;margin-bottom:-20px">
  </div>
  <div aria-hidden="true" data-ft-big="" style="font-family:Lilita One, Outfit, sans-serif;font-weight:400;font-size:15.5vw;line-height:.78;letter-spacing:-.035em;text-transform:uppercase;color:#16406B;text-align:center;white-space:nowrap;margin-bottom:2.5vw;user-select:none">Grupo Bimbo</div>
  <div style="position:relative">
    <div style="max-width:1440px;margin:0 auto;padding:32px 32px 40px;display:flex;flex-wrap:wrap;gap:12px 28px;font-size:13px;opacity:.8;align-items:center">
      <span>© 2026 Grupo Bimbo, S.A.B. de C.V.</span>
      <span>BMV: BIMBO · OTC: BMBOY</span>
      <a href="#" style="color:#FAE5C5;transition:color .3s, background .3s, transform .35s cubic-bezier(.34,1.56,.64,1)" style-hover="color:#FAE5C5;transform:translateX(4px)">Aviso de privacidad</a>
      <a href="#" style="color:#FAE5C5;transition:color .3s, background .3s, transform .35s cubic-bezier(.34,1.56,.64,1)" style-hover="color:#FAE5C5;transform:translateX(4px)">Términos y condiciones</a>
      <a href="#" style="color:#FAE5C5;transition:color .3s, background .3s, transform .35s cubic-bezier(.34,1.56,.64,1)" style-hover="color:#FAE5C5;transform:translateX(4px)">Política de cookies</a>
      <span style="margin-left:auto">Powered by <strong style="font-weight:800">Nuclea Studio</strong></span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;640px&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const c = (t, items) => ({ t, items: items.map(([t, href]) => ({ t, href })) });
    return {
      redes: ['LinkedIn', 'Instagram', 'YouTube', 'X', 'Facebook'],
      cols: [
        c('Nosotros', [['Quiénes somos','Nosotros.dc.html'],['Historia','Nosotros.dc.html#historia'],['Fundadores','Nosotros.dc.html#fundadores'],['Liderazgo','Nosotros.dc.html#liderazgo'],['Reconocimientos','Nosotros.dc.html#reconocimientos']]),
        c('Marcas', [['Directorio de marcas','Marcas.dc.html'],['Marcas por país','Marcas.dc.html#regiones'],['Visita nuestras panaderías','Contacto.dc.html#visitas']]),
        c('Sustentabilidad', [['Para Ti','Sustentabilidad.dc.html#para-ti'],['Para la Vida','Sustentabilidad.dc.html#para-la-vida'],['Para la Naturaleza','Sustentabilidad.dc.html#para-la-naturaleza'],['Reportes y descargas','Sustentabilidad.dc.html#descargas']]),
        c('Contacto', [['Inversionistas','Inversionistas.dc.html'],['Prensa','Prensa.dc.html'],['Carreras','Carreras.dc.html'],['Proveedores','Contacto.dc.html#proveedores'],['Línea ética Comenta','Contacto.dc.html#comenta']]),
      ],
    };
  }
}
</script>
</body>
</html>
