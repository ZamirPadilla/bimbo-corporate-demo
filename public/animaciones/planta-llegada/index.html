<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planta · Demo Grupo Bimbo</title>
<style>
  :root { --fondo: #dfe7ef; --texto: #2b3445; --suave: #6b778a; }
  html, body { margin: 0; background: var(--fondo); color: var(--texto);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* la animación vive en un contenedor: se puede soltar tal cual en una sección de la página */
  .planta-3d { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100vh; overflow: hidden; background: var(--fondo); }
  @media (max-width: 700px) { .planta-3d { aspect-ratio: 4 / 5; } }
  .planta-3d canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .planta-3d .velo { position: absolute; inset: 0; background: var(--fondo); opacity: 1; transition: opacity .7s ease; pointer-events: none; }
  .planta-3d .velo.fuera { opacity: 0; }
  .planta-3d .cargando { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--suave); }
  #depurar { position: absolute; top: 12px; left: 12px; font: 12px ui-monospace, monospace; background: rgb(255 255 255 / 0.7);
    padding: 6px 10px; border-radius: 6px; display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<section class="planta-3d" id="planta-3d" aria-label="Animación: un camión Bimbo llega al andén de la planta mientras un tráiler sale a la calle">
  <canvas></canvas>
  <div class="velo"></div>
  <div class="cargando">Cargando planta…</div>
  <div id="depurar"></div>
</section>
<script type="module" src="main.js"></script>
</body>
</html>
